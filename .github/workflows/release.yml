name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Validate release version
        run: ./scripts/check-version.sh

      - name: Run core smoke tests
        run: swift run MacEaseCoreSmokeTests

      - name: Build release DMG
        run: ./scripts/build-release.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./scripts/version.sh
          load_version "$GITHUB_WORKSPACE"
          gh release create "$MACEASE_TAG" \
            dist/MacEase-"$MACEASE_TAG"-arm64.dmg \
            dist/MacEase-"$MACEASE_TAG"-arm64.dmg.sha256 \
            --verify-tag \
            --title "MacEase $MACEASE_VERSION" \
            --generate-notes
