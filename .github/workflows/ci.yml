name: CI

on:
  push:
  pull_request:

jobs:
  core-smoke-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Validate version metadata
        run: ./scripts/check-version.sh
      - name: Build core
        run: swift build
      - name: Run file-system smoke tests
        run: swift run MacEaseCoreSmokeTests
